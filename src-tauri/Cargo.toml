[package]
name = "pps-hachi"
version = "0.1.0"
description = "PPS Hachi — an 8-step Toyota Practical Problem Solving A3 report tool"
authors = ["PPS Hachi"]
edition = "2021"
# D-62 added a second binary (gen_ppsx_fixtures, src/bin/) back in Phase 2/3.
# `tauri dev`'s DevCommand invokes bare `cargo run`, which cannot pick between
# two binaries without this — `npm run tauri dev` has been broken since
# Phase 2/3 without anyone noticing, since CI only ever runs `tauri build`
# (one binary, no ambiguity) and this is the first session to walk `tauri dev`.
default-run = "pps-hachi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pps_hachi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"
rust_xlsxwriter = "0.97.0"
base64 = "0.23.0"
image = "0.25.10"
kamadak-exif = "0.6.1"
# D-200: `v1` (default feature) covers macOS Keychain + Windows Credential
# Manager, which is all this app targets — the newer `cli` feature (multi-
# backend selection) is explicitly aimed at apps that need to choose between
# several backends per platform, not our case. Verified against the crate's
# own Cargo.toml (github.com/open-source-cooperative/keyring-rs), not memory.
keyring = "4"
# D-200: Vorion's Prediction endpoints are multipart/form-data (a JSON `data`
# field + optional file attachments), not plain JSON bodies — confirmed
# against the real vorionai.com/docs "Synchronous Prediction" reference by
# Barış in his authenticated session, not assumed. Default features (kept
# on, unlike most other deps here, because they include `default-tls` — HTTPS
# needs a TLS backend) plus `json` and `multipart`, both opt-in on reqwest 0.13.
reqwest = { version = "0.13", features = ["json", "multipart"] }

[dev-dependencies]
calamine = "0.36.1"

