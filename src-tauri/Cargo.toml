[package]
name = "pps-hachi"
version = "0.1.0"
description = "PPS Hachi — an 8-step Toyota Practical Problem Solving A3 report tool"
authors = ["PPS Hachi"]
edition = "2021"
# D-62 added a second binary (gen_ppsx_fixtures, src/bin/) back in Phase 2/3.
# `tauri dev`'s DevCommand invokes bare `cargo run`, which cannot pick between
# two binaries without this — `npm run tauri dev` has been broken since
# Phase 2/3 without anyone noticing, since CI only ever runs `tauri build`
# (one binary, no ambiguity) and this is the first session to walk `tauri dev`.
default-run = "pps-hachi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pps_hachi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"
rust_xlsxwriter = "0.97.0"
base64 = "0.23.0"
image = "0.25.10"
kamadak-exif = "0.6.1"
# D-200: `v1` (default feature) covers macOS Keychain + Windows Credential
# Manager, which is all this app targets — the newer `cli` feature (multi-
# backend selection) is explicitly aimed at apps that need to choose between
# several backends per platform, not our case. Verified against the crate's
# own Cargo.toml (github.com/open-source-cooperative/keyring-rs), not memory.
keyring = "4"
# D-200: Vorion's Prediction endpoints are multipart/form-data (a JSON `data`
# field + optional file attachments), not plain JSON bodies — confirmed
# against the real vorionai.com/docs "Synchronous Prediction" reference by
# Barış in his authenticated session, not assumed. Default features (kept
# on, unlike most other deps here, because they include `default-tls` — HTTPS
# needs a TLS backend) plus `json` and `multipart`, both opt-in on reqwest 0.13.
# D-201: `stream` added for Streaming Prediction (SSE) — `Response::
# bytes_stream()` is gated behind it (confirmed against reqwest 0.13.4's own
# `Cargo.toml` feature table, not assumed).
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
# D-201: only `StreamExt::next()` is needed to drive `bytes_stream()`'s
# `futures_core::Stream` — reqwest already pulls this crate in transitively
# at 0.3.33 (confirmed in `Cargo.lock`), declared directly here only because
# a transitive dependency's items aren't nameable from this crate otherwise.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# J2/D-205: verified against docs.rs before writing any ingestion code — the
# `Sheets` enum this crate's own `open_workbook_auto` returns has exactly
# four variants (Xls/Xlsx/Xlsb/Ods), no `Csv` variant exists anywhere in the
# crate. SPEC.md §8.9's "xlsx/csv → parsed with calamine" is wrong on the csv
# half; moved here from `[dev-dependencies]` (Phase 4's own dev-only round-
# trip test in `tests/xlsx.rs` keeps compiling unchanged — a crate declared
# under `[dependencies]` is already available to test builds).
calamine = "0.36.1"
# J2/D-205: calamine has no CSV reader at all (confirmed above) — `csv`
# (BurntSushi, crates.io's de facto standard, RFC 4180-compliant) is the
# second, independent reader for the csv half of this dilim's scope.
# Verified current version against the real crates.io API (1.4.0), not
# assumed.
csv = "1.4.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Faz 8 Dilim 3 (D-20 "AI kapalı" mutlu-yol E2E'si). A `[target.'cfg(debug_
# assertions)'.dependencies]` table was tried first (the pattern @wdio/tauri-
# service's own docs show) and empirically DISPROVED by running
# `cargo check --release` against it: Cargo resolves `[target.'cfg(...)']`
# dependency tables once, independent of profile — `debug_assertions` in that
# position does not distinguish debug from release the way it does inside
# `#[cfg(debug_assertions)]` in source. A real `cargo check --release` still
# pulled both crates in, which would have shipped WebdriverIO's execute/mock
# bridge and its embedded WebDriver HTTP server in a real Farplas binary. An
# explicit, opt-in Cargo feature is the correct mechanism: with no `--features
# e2e-test`, `dep:tauri-plugin-wdio`/`dep:tauri-plugin-wdio-webdriver` are
# never even resolved, verified the same way (`cargo check --release` after
# this fix compiles neither crate). Both crate versions verified against
# crates.io directly (not WebSearch, which reported a stale 1.0.0-next.0 —
# the real published version is 1.3.0, maintained under webdriverio/
# desktop-mobile).
[dependencies.tauri-plugin-wdio]
version = "1"
optional = true

[dependencies.tauri-plugin-wdio-webdriver]
version = "1"
optional = true

[features]
e2e-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

