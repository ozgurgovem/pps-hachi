[package]
name = "pps-hachi"
version = "0.1.0"
description = "PPS Hachi — an 8-step Toyota Practical Problem Solving A3 report tool"
authors = ["PPS Hachi"]
edition = "2021"
# D-62 added a second binary (gen_ppsx_fixtures, src/bin/) back in Phase 2/3.
# `tauri dev`'s DevCommand invokes bare `cargo run`, which cannot pick between
# two binaries without this — `npm run tauri dev` has been broken since
# Phase 2/3 without anyone noticing, since CI only ever runs `tauri build`
# (one binary, no ambiguity) and this is the first session to walk `tauri dev`.
default-run = "pps-hachi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pps_hachi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"
rust_xlsxwriter = "0.97.0"
base64 = "0.23.0"
image = "0.25.10"
kamadak-exif = "0.6.1"

[dev-dependencies]
calamine = "0.36.1"

