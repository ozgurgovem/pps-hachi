name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "reference/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "reference/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # D-20 / Faz 8 Dilim 3: the "AI off" happy-path E2E suite. Builds a
      # separate debug binary via `tauri build --debug --no-bundle --features
      # e2e-test` (never `--release`, never the flags the step below uses) —
      # see e2e/wdio.conf.ts and DECISIONS.md for why. `driverProvider:
      # "embedded"` needs no native driver install on either runner.
      - name: E2E test build (AI off happy path)
        run: npm run test:e2e:build

      - name: E2E test (AI off happy path)
        run: npm run test:e2e

      - name: Build app (unsigned)
        run: npm run tauri build
        env:
          # No code signing at this stage (SPEC.md §5) — unsigned builds still install,
          # they just trigger a dismissible SmartScreen/Gatekeeper warning.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pps-hachi-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
